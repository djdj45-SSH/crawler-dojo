<!DOCTYPE html>
<!-- crawler-dojo · 文章页
     占位符：TITLE / DATE / SLUG / BODY / WORDS / TAGS -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · DOJO-1</title>
<style>
  :root{--bg:#0b0d10;--panel:#12161b;--line:#242b33;--text:#e8edf2;--mute:#8b98a5;--amber:#FFB65C;--cyan:#5AD2E6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);padding:48px 24px;
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto}
  .back{font-size:12px;color:var(--mute)}
  .back a{color:var(--cyan);text-decoration:none}
  h1{font-size:26px;font-weight:600;margin:18px 0 10px;line-height:1.4}
  .byline{font-size:12px;color:var(--mute);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:10.5px;letter-spacing:.08em;color:var(--mute);border:1px solid var(--line);padding:2px 7px}
  p{font-size:14px;line-height:1.95;color:#c8d3dd;margin-bottom:16px}
  .slug{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">

  <div class="back"><a href="/">← 返回列表</a></div>

  <h1>{{TITLE}}</h1>

  <div class="byline">
    {{DATE}} · {{WORDS}} 字
    <div class="tags">{{TAGS}}</div>
  </div>

  <article>
{{BODY}}
  </article>

  <div class="slug">slug: {{SLUG}}</div>

</div>
</body>
</html>
